services:
  frontend:
    build: ./frontend
    ports:
      - "8081:80"
    depends_on:
      nginx:
        condition: service_started
    networks:
      - frontend_net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      auth-service:
        condition: service_healthy
      case-service:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net

  auth-service:
    build: ./services/auth-service
    env_file: .env
    depends_on:
      auth-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend_net]

  case-service:
    build: ./services/case-service
    env_file: .env
    depends_on:
      case-db:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      anonymization-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend_net]

  ner-service:
    build: ./services/ner-service
    env_file: .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend_net]

  anonymization-service:
    build: ./services/anonymization-service
    env_file: .env
    depends_on:
      ner-service:
        condition: service_healthy
      anonymized-db:
        condition: service_healthy
      personal-data-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend_net]

  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend_net]

  case-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: case_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d case_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend_net]

  anonymized-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: anonymized_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d anonymized_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend_net]

  personal-data-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: personal_data_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d personal_data_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend_net]

networks:
  frontend_net:
  backend_net:
    internal: true